name: Build Signed Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "release-v*"

permissions:
  contents: write

concurrency:
  group: android-signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable package manager
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Restore protected Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-upload-key.jks

      - name: Apply release signing
        run: |
          cp scripts/release-signing.gradle android/app/release-signing.gradle
          printf '\napply from: "release-signing.gradle"\n' >> android/app/build.gradle

      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew app:assembleRelease app:bundleRelease --no-daemon

      - name: Upload signed Android files
        uses: actions/upload-artifact@v4
        with:
          name: python-bez-strakha-signed-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/release-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            --repo "$GITHUB_REPOSITORY" \
            --title "Python без страха $TAG_NAME" \
            --generate-notes
