name: Verify Android Recorded Audio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-recorded-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies and create Android project
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npx expo prebuild --platform android --no-install
      - name: Build debug APK with recorded lesson audio
        working-directory: android
        run: ./gradlew app:assembleDebug --no-daemon
      - name: Start Android emulator and prove senior-2 audio starts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -a android.intent.action.VIEW -d "manuspythonbezstrakha://audio-smoke" com.app.pythonbezstrakha
            sleep 10
            adb logcat -d | tee audio-smoke.log
            grep -F "[audio-smoke] PASS playing=true duration=positive" audio-smoke.log
