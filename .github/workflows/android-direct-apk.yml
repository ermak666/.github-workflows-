name: Build Android APK Directly

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

concurrency:
  group: android-direct-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable package manager
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: python-bez-strakha-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
